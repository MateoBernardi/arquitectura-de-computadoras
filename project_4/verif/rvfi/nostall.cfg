# riscv-formal: VARIANTE sin stall de load-use (verif/variants/hazard_unit_nostall.v).
# Generar y correr:  ./run.sh   (ver README.md)

[options]
isa rv32i

[depth]
insn            15
reg        8    15
pc_fwd     8    15
pc_bwd     8    15
unique     1  8 15
causal     8    15
cover      1    15

[defines]
`define RISCV_FORMAL_ALIGNED_MEM

[script-defines]
# control.v incluye alu_ops.vh, que está en 3_execute/ (en Vivado lo resuelve el include path)
verilog_defaults -add -I@basedir@/../../project_4/project_4.srcs/sources_1/new/pipeline/3_execute

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
@basedir@/cores/@core@/imem_anyseq.v
@basedir@/../../project_4/project_4.srcs/sources_1/new/pipeline/riscv_pipeline.v
@basedir@/../../project_4/project_4.srcs/sources_1/new/pipeline/2_decode/control.v
@basedir@/../../project_4/project_4.srcs/sources_1/new/pipeline/2_decode/immgen.v
@basedir@/../../project_4/project_4.srcs/sources_1/new/pipeline/2_decode/regfile.v
@basedir@/../../project_4/project_4.srcs/sources_1/new/pipeline/3_execute/alu.v
@basedir@/../../project_4/project_4.srcs/sources_1/new/pipeline/3_execute/branch_unit.v
@basedir@/../../project_4/project_4.srcs/sources_1/new/pipeline/4_memory/dmem.v
@basedir@/../../project_4/project_4.srcs/sources_1/new/pipeline/flow/flush_unit.v
@basedir@/../../project_4/project_4.srcs/sources_1/new/pipeline/flow/forward_unit.v
@basedir@/../../project_4/verif/variants/hazard_unit_nostall.v
@basedir@/../../project_4/project_4.srcs/sources_1/new/pipeline/regs/pipe_reg.v

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);
